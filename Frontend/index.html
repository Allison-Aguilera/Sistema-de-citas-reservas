<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Citas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- FullCalendar CSS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css' rel='stylesheet' />
    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bs-primary: #1C6F66;
            --bs-primary-rgb: 28, 111, 102;
            --bs-primary-bg-subtle: #DCEEEA;
            --bs-primary-border-subtle: #B7DBD5;
            --bs-primary-text-emphasis: #14534C;
            --bs-body-bg: #F5F7F6;
            --bs-body-font-family: 'Plus Jakarta Sans', system-ui, sans-serif;

            --color-libre: #3F8F5F;
            --color-citas: #D9A441;
            --color-bloqueado: #C1554A;
        }
        [data-bs-theme="dark"] {
            --bs-primary: #4FCBB8;
            --bs-primary-rgb: 79, 203, 184;
            --bs-primary-bg-subtle: #123B37;
            --bs-primary-border-subtle: #1C5750;
            --bs-primary-text-emphasis: #8FE0D3;
            --bs-body-bg: #14181A;

            --color-libre: #57A876;
            --color-citas: #E0B15C;
            --color-bloqueado: #D6746A;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        h1, .fw-bold, .fc-toolbar-title {
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(20, 40, 38, 0.05);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        [data-bs-theme="dark"] .card {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
            background-color: #1B2023 !important;
        }

        /* --- Calendario --- */
        .fc {
            --fc-border-color: var(--bs-border-color);
            --fc-today-bg-color: rgba(var(--bs-primary-rgb), 0.06);
        }
        .fc-toolbar-title {
            font-size: 1.2rem !important;
        }
        .fc-button-primary {
            background-color: transparent !important;
            border: 1.5px solid var(--bs-primary-border-subtle) !important;
            color: var(--bs-primary-text-emphasis) !important;
            border-radius: 8px !important;
            font-weight: 600;
            text-transform: capitalize;
            padding: 6px 14px !important;
            box-shadow: none !important;
        }
        .fc-button-primary:hover {
            background-color: var(--bs-primary-bg-subtle) !important;
            border-color: var(--bs-primary-border-subtle) !important;
        }
        .fc-button-primary:not(:disabled).fc-button-active,
        .fc-button-primary:not(:disabled):active {
            background-color: var(--bs-primary) !important;
            border-color: var(--bs-primary) !important;
            color: #fff !important;
        }
        .fc-daygrid-day-number, .fc-col-header-cell-cushion {
            font-weight: 500;
            color: var(--bs-body-color);
        }

        /* --- Leyenda de estado (elemento firma) --- */
        .leyenda-estado {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--bs-secondary-color);
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--bs-border-color);
        }
        .leyenda-item {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .leyenda-punto {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .panel-header {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--bs-secondary-color);
            text-transform: uppercase;
            border-bottom: 2px solid var(--bs-border-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .evento-item {
            transition: all 0.2s ease;
            border-left: 3px solid var(--color-citas);
            padding: 10px 12px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 8px;
        }
        [data-bs-theme="light"] .evento-item {
            background: #F8FAF9;
        }
        [data-bs-theme="dark"] .evento-item {
            background: #23292C;
        }
        .evento-item:hover {
            transform: translateX(3px);
        }

        /* --- Estados de día --- */
        .dia-bloqueado { background-color: rgba(193, 85, 74, 0.14) !important; }
        .dia-con-citas { background-color: rgba(217, 164, 65, 0.20) !important; }
        .dia-libre     { background-color: rgba(63, 143, 95, 0.12) !important; }

        /* --- Botón flotante --- */
        .btn-flotante-mas {
            position: absolute;
            bottom: 18px;
            right: 18px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background-color: var(--bs-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(var(--bs-primary-rgb), 0.35);
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-flotante-mas:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(var(--bs-primary-rgb), 0.45);
        }
    </style>
</head>
<body class="bg-body">

    <div class="container-fluid py-4 px-4" style="max-width: 1400px; position: relative;">
        
        <!-- Barra superior -->
        <div class="row mb-4">
            <div class="col-12 bg-body-tertiary px-4 py-3 rounded-4 shadow-sm d-flex justify-content-between align-items-center border">
                <div class="d-flex align-items-center">
                    <div class="bg-primary-subtle text-primary p-2 rounded-3 me-3">
                        <i class="fa-regular fa-calendar-check fs-4"></i>
                    </div>
                    <div>
                        <h1 class="h5 mb-0 fw-bold">Panel de Citas</h1>
                        <p class="text-muted small mb-0">Gestión y control de agenda</p>
                    </div>
                </div>
                <button id="btn-tema" onclick="alternarTema()" class="btn btn-outline-secondary btn-sm rounded-circle p-2" style="width: 38px; height: 38px;" title="Cambiar tema">
                    <i class="fa-solid fa-moon" id="icono-tema"></i>
                </button>
            </div>
        </div>

        <!-- Layout Principal -->
        <div class="row g-4">
            <!-- Calendario -->
            <div class="col-lg-8 position-relative">
                <div class="card p-4 bg-body" style="min-height: 700px;">

                    <!-- Leyenda de estado -->
                    <div class="leyenda-estado">
                        <div class="leyenda-item">
                            <span class="leyenda-punto" style="background: var(--color-libre);"></span>
                            Disponible
                        </div>
                        <div class="leyenda-item">
                            <span class="leyenda-punto" style="background: var(--color-citas);"></span>
                            Con citas
                        </div>
                        <div class="leyenda-item">
                            <span class="leyenda-punto" style="background: var(--color-bloqueado);"></span>
                            No laborable
                        </div>
                    </div>

                    <div id="calendar"></div>
                </div>
                <div class="btn-flotante-mas" onclick="abrirFormularioCita()" title="Nueva Cita">
                    <i class="fa-solid fa-plus fs-5"></i>
                </div>
            </div>

            <!-- Panel Lateral -->
            <div class="col-lg-4">
                
                <div class="card p-4 mb-4 bg-body">
                    <div class="panel-header">
                        <i class="fa-solid fa-circle-dot text-warning me-2 fs-6"></i>HOY
                    </div>
                    <div id="panel-hoy">
                        <div class="text-muted small py-2">Sin citas programadas para hoy.</div>
                    </div>
                </div>

                <div class="card p-4 bg-body">
                    <div class="panel-header">
                        <i class="fa-regular fa-clock me-2"></i>PRÓXIMOS EVENTOS
                    </div>
                    <div id="panel-proximos" style="max-height: 380px; overflow-y: auto;">
                        <div class="text-muted small py-2">No hay próximos eventos.</div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <!-- Tu lógica de la aplicación -->
    <script src="/static/app.js"></script>
</body>
</html>
